# Served at http://dinner.local through the nginx ingress controller, which
# Docker Desktop publishes on localhost:80. The name needs a 127.0.0.1 line in
# /etc/hosts, which `npm run k8s:deploy` prints if it is missing.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dinner-planer
spec:
  ingressClassName: nginx
  rules:
    - host: dinner.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dinner-planer
                port:
                  name: http
