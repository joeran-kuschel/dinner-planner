# The same check as `npm run check` on a developer's machine: build, lint, Vitest, typecheck and
# Playwright against a throwaway Postgres, inside Playwright's own image (the browser and its libraries are in it).
# See documentation/backend/github-actions.md.
name: Check

on:
  pull_request:
  push:
    branches: [main]

# Read-only token, no secrets: a pull request from a fork gets nothing it could leak or misuse.
permissions:
  contents: read

# A newer push to the same pull request makes the older run pointless. Runs on main are never cancelled,
# so every merged commit gets a result.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Playwright's image has the browser Playwright drives and every library it needs, so nothing is installed from apt at run
    # time: a stalled Ubuntu mirror cost pull requests several runs (documentation/backend/github-actions.md). The tag is the
    # installed version of @playwright/test, the lockfile's (tests/infra/github-actions.test.ts compares them), pinned by its digest like
    # the actions are by their commit; update both together, with `docker buildx imagetools inspect <image>:<tag>`.
    # `--ipc=host` and `--init` are Playwright's advice for Chromium in a container (shared memory, stray processes).
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --ipc=host --init

    services:
      # The same image, user and database as compose.yaml. The job runs in a container, so the database is reached by
      # the service's name on its own port (`postgres:5432`), not through a published host port. The password is a throwaway that
      # exists only on this runner: there is no .env here, and a fork's pull request is given no secret values.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: dinner
          POSTGRES_PASSWORD: ci-throwaway
          POSTGRES_DB: dinner_planner
        options: >-
          --health-cmd "pg_isready -U dinner -d dinner_planner"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://dinner:ci-throwaway@postgres:5432/dinner_planner?schema=public

    steps:
      # Actions are pinned to a commit, not a tag that can move; Dependabot proposes updates
      # (.github/dependabot.yml).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The workspace belongs to the runner's user and the container runs as root, so git refuses it ("dubious ownership")
      # and the infra tests that run `git ls-files` fail. Checkout only trusts it for its own git calls.
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # The image has Node 24 too; this is here for `cache: npm`, which keeps the downloaded packages between runs.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # generated/prisma is not committed.
      - run: npm run db:generate

      # The typecheck reads the route types (PageProps, LayoutProps) that `next dev` and `next build` write
      # to .next/types, which a fresh checkout does not have yet. The check's build writes them too, before the typecheck
      # runs; this keeps the typecheck from depending on the order of the stages.
      - run: npx next typegen

      - run: npm run check

      # Traces and screenshots of a failed Playwright test (the stage reports with the line reporter,
      # so there is no HTML report).
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: test-results
          path: test-results
          if-no-files-found: ignore
          retention-days: 7
