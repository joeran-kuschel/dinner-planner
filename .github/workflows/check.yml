# The same check as `npm run check` on a developer's machine: build, lint, Vitest, typecheck and
# Playwright against a throwaway Postgres. See documentation/backend/github-actions.md.
name: Check

on:
  pull_request:
  push:
    branches: [main]

# Read-only token, no secrets: a pull request from a fork gets nothing it could leak or misuse.
permissions:
  contents: read

# A newer push to the same pull request makes the older run pointless. Runs on main are never cancelled,
# so every merged commit gets a result.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      # The same image, user and database as compose.yaml, on the same host port as `npm run db:up`. The password
      # is a throwaway that exists only on this runner: there is no .env here, and a fork's pull request is given no secret values.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: dinner
          POSTGRES_PASSWORD: ci-throwaway
          POSTGRES_DB: dinner_planner
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U dinner -d dinner_planner"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://dinner:ci-throwaway@localhost:5433/dinner_planner?schema=public

    steps:
      # Actions are pinned to a commit, not a tag that can move; Dependabot proposes updates
      # (.github/dependabot.yml).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # generated/prisma is not committed.
      - run: npm run db:generate

      # The typecheck reads the route types (PageProps, LayoutProps) that `next dev` and `next build` write
      # to .next/types, which a fresh checkout does not have yet. The check's build writes them too, before the typecheck
      # runs; this keeps the typecheck from depending on the order of the stages.
      - run: npx next typegen

      # The browser Playwright drives is a download of about 150 MB: kept between runs, under a key that changes with
      # Playwright's version only. This saves the download; the stall below was in apt, which it does not touch. (The cache is
      # saved when the job succeeds, so a run whose check fails downloads again next time.)
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('node_modules/playwright-core/package.json') }}

      # The browser's system libraries come from apt on every run, since a runner starts empty. It normally takes
      # about 25 s; on 2026-10-26 one run waited 11 minutes for it. An attempt that takes longer than 120 s (apt, and the
      # download when the cache was empty) is stopped and tried again, three times at most, so a stuck mirror costs minutes,
      # not a quarter of an hour. `timeout` runs as the runner user and cannot stop the root apt-get that Playwright starts
      # through sudo (on 2026-10-26 it kept the dpkg lock, and the next two attempts failed at once with "lock held by
      # process …"), so between attempts those processes are stopped as root and dpkg is asked to finish what they left half-done.
      - name: Install the browser and its libraries
        timeout-minutes: 10
        run: |
          for attempt in 1 2 3; do
            if timeout --kill-after=10 120 npx playwright install --with-deps chromium; then exit 0; fi
            echo "::warning::Installing the browser did not finish within 120 seconds, or failed (attempt $attempt of 3)."
            if [ "$attempt" -lt 3 ]; then
              # Exact names only: apt-get and dpkg, and apt's own download helpers (processes called http and https).
              for name in apt-get apt dpkg http https; do sudo pkill -KILL -x "$name" || true; done
              sleep 3
              timeout 30 sudo dpkg --configure -a || true
            fi
          done
          exit 1

      - run: npm run check

      # Traces and screenshots of a failed Playwright test (the stage reports with the line reporter,
      # so there is no HTML report).
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: test-results
          path: test-results
          if-no-files-found: ignore
          retention-days: 7
